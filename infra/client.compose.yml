# Next.js client as a container. Local: docker compose -f docker-compose.yml -f infra/client.compose.yml up -d --build --wait
# NEXT_PUBLIC_* are baked in at build time; defaults point at the local stack.
name: nearly
services:
  client:
    build:
      context: .
      dockerfile: infra/client.Dockerfile
      args:
        NEXT_PUBLIC_NETWORK: ${NEAR_NETWORK:-testnet}
        NEXT_PUBLIC_SITE_URL: http://localhost:${CLIENT_PORT:-3000}
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
        NEXT_PUBLIC_MARKET_DATA_URL: http://localhost:${MARKET_DATA_PORT:-8082}
        NEXT_PUBLIC_WS_URL: ws://localhost:${MARKET_DATA_PORT:-8082}/api/v1/ws
        NEXT_PUBLIC_HISTORY_URL: http://localhost:${HISTORY_PORT:-8087}
    restart: unless-stopped
    ports: ["127.0.0.1:${CLIENT_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
