services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: nearly, POSTGRES_PASSWORD: nearly, POSTGRES_DB: nearly }
    ports: ["5432:5432"]
    # applied once, on a fresh volume
    volumes: ["./migrations:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
